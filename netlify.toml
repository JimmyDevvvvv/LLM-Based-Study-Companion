[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/.next"

[build.environment]
  # Node.js version
  NODE_VERSION = "20.5.0"
  NPM_VERSION = "10.8.0"
  
  # Python version for Netlify Functions
  PYTHON_VERSION = "3.9"
  
  # Build optimizations
  NODE_OPTIONS = "--max_old_space_size=4096"
  
  # Disable Next.js telemetry
  NEXT_TELEMETRY_DISABLED = "1"
  
  # Disable ESLint during build
  ESLINT_NO_DEV_ERRORS = "true"
  
  # Disable TypeScript type checking during build
  TSC_COMPILE_ON_ERROR = "true"
  
  # Enable Next.js standalone output
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

# Configure functions - from repo root (no base directory)
[functions]
  directory = "netlify/functions"
  included_files = ["backend/**"]
  
  # Python functions don't use node_bundler
  # node_bundler = "esbuild"
  # external_node_modules = ["@next/swc-wasm-nodejs"]

# Next.js plugin - must be first
[[plugins]]
  package = "@netlify/plugin-nextjs"

# API redirects - MUST come before catch-all redirect
# Use 200 status to proxy, not redirect
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Catch-all redirect for Next.js (must come after API redirects)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Development server settings
[dev]
  command = "npm run dev"
  port = 3000
  publish = "frontend/.next"
  targetPort = 3000
