[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/.next"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.9"
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[plugins]]
  package = "@netlify/plugin-nextjs"

[dev]
  command = "cd frontend && npm run dev"
  port = 3000
  targetPort = 3000
  publish = "frontend/.next"
  autoLaunch = false
